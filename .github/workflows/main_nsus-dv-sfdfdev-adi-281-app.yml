# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Stability Capture to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/api/package-lock.json

      - name: Install and test the API
        run: |
          npm ci --prefix backend/api
          npm test --prefix backend/api
          npm ci --omit=dev --prefix backend/api

      - name: Build the React frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Assemble Azure Web App package
        run: |
          rm -rf deploy-package
          mkdir -p deploy-package/frontend deploy-package/backend
          cp -R frontend/dist deploy-package/frontend/dist
          cp -R backend/api deploy-package/backend/api
          cat > deploy-package/package.json <<'EOF'
          { "name": "stability-capture-webapp", "private": true, "scripts": { "start": "node backend/api/src/server.js" } }
          EOF

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-package

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy-package
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'nsus-dv-sfdfdev-adi-281-app'
          slot-name: 'Production'
          package: deploy-package
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BE7CDA6F6A94411BA1720C7D51248D28 }}